name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and run offline protocol checks
        shell: pwsh
        run: .\build.ps1
      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: LamAngStudio-windows-x64
          path: |
            dist/LamAngStudio.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
